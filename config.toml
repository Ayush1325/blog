base_url = "https://programmershideaway.dev"

title = "Programmer's Hideaway"
description = "My Personal Website"
author = "Ayush Singh"

compile_sass = true
minify_html = true

generate_feeds = true
default_language = "en"
build_search_index = true

theme = "apollo"

taxonomies = [
    { name = "tags", feed = true },
]

[extra]
toc = true
# Copy button in code snippets.
fancy_code = true
repo_view = true
repo_url = "https://github.com/Ayush1325/blog"
favicon = "icons/favicon.svg"
socials = [
	{ name = "github", url = "https://github.com/Ayush1325/", icon = "github" },
	{ name = "linkedin", url = "https://www.linkedin.com/in/ayush-singh-665739204/", icon = "linkedin" },
	{ name = "mastodon", url = "https://fosstodon.org/@ayush1325", icon = "mastodon" },
        { name = "twitter", url = "https://x.com/AyushS1325", icon = "x-twitter" },
        { name = "rss", url = "https://programmershideaway.dev/atom.xml", icon = "rss" },
]
menu = [
        { name = "/posts", url = "posts", trailing_slash = true },
        { name = "/archive", url = "archive", trailing_slash = true },
        { name = "/tags", url = "tags", trailing_slash = true },
]

[extra.giscus]
# Read by templates/_giscus_script.html (apollo ships an unconfigured utterances stub).
# Comments are enabled per post via `[extra] comment = true` in front matter.
repo = "Ayush1325/blog"
repo_id = "R_kgDOLCCfYQ"
category = "Announcements"
category_id = "DIC_kwDOLCCfYc4CcR4t"
mapping = "slug"
strict_title_matching = 1
enable_reactions = 1
light_theme = "noborder_light"
dark_theme = "noborder_dark"
lang = ""  # Leave blank to match the page's language.
lazy_loading = true

[search]
# Whether to include the title of the page/section in the index.
include_title = true
# Whether to include the description of the page/section in the index.
include_description = true
# Whether to include the path of the page/section in the index.
include_path = true
# Whether to include the rendered content of the page/section in the index.
include_content = true

[markdown]
lazy_async_image = true

[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"
error_on_missing_language = false

[extra.analytics]
enabled = false
